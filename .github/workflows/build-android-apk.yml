name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configure Capacitor & Live Server URL (if APP_URL is set)
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            if (process.env.APP_NAME && process.env.APP_NAME.trim()) {
              cfg.appName = process.env.APP_NAME.trim();
            }
            if (process.env.APP_URL && process.env.APP_URL.trim()) {
              cfg.server = {
                url: process.env.APP_URL.trim().replace(/\/+$/, ""),
                cleartext: true,
                androidScheme: "https"
              };
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("usesCleartextTraffic")) {
                xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              }
              fs.writeFileSync(manifestPath, xml);
            }
          '

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sb-salon-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APK
          body: "Download `app-debug.apk` directly from Assets below."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
