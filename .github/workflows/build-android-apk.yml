name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 @capacitor/local-notifications@^6.1.0

      - name: Configure Android Permissions & Output Folder
        run: |
          mkdir -p release-apks
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("usesCleartextTraffic")) {
                xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              }
              if (!xml.includes("POST_NOTIFICATIONS")) {
                xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application");
              }
              if (!xml.includes("android.permission.VIBRATE")) {
                xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.VIBRATE\" />\n    <application");
              }
              fs.writeFileSync(manifestPath, xml);
            }
          '

      - name: Build 1 — Customer APK (com.sbsalon.customer)
        env:
          VITE_API_BASE_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          VITE_APP_FLAVOR: CUSTOMER
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            const baseName = (process.env.APP_NAME && process.env.APP_NAME.trim()) || "SB Salon";
            cfg.appId = "com.sbsalon.customer";
            cfg.appName = `${baseName} Customer`;
            if (process.env.APP_URL && process.env.APP_URL.trim()) {
              cfg.server = {
                url: process.env.APP_URL.trim().replace(/\/+$/, ""),
                cleartext: true,
                androidScheme: "https"
              };
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          rm -rf android
          npx cap add android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }
            if (!xml.includes("POST_NOTIFICATIONS")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application");
            }
            if (!xml.includes("android.permission.VIBRATE")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.VIBRATE\" />\n    <application");
            }
            fs.writeFileSync(manifestPath, xml);
          '
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apks/customer-app-debug.apk

      - name: Build 2 — Salon Shop APK (Malik + Reception + Staff)
        env:
          VITE_API_BASE_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          VITE_APP_FLAVOR: SHOP
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            const baseName = (process.env.APP_NAME && process.env.APP_NAME.trim()) || "SB Salon";
            cfg.appId = "com.sbsalon.manager";
            cfg.appName = `${baseName} Manager`;
            if (process.env.APP_URL && process.env.APP_URL.trim()) {
              cfg.server = {
                url: process.env.APP_URL.trim().replace(/\/+$/, ""),
                cleartext: true,
                androidScheme: "https"
              };
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          rm -rf android
          npx cap add android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }
            if (!xml.includes("POST_NOTIFICATIONS")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application");
            }
            if (!xml.includes("android.permission.VIBRATE")) {
              xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.VIBRATE\" />\n    <application");
            }
            fs.writeFileSync(manifestPath, xml);
          '
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apks/salon-shop-debug.apk

      - name: Upload Both Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: sb-salon-android-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish Direct Download APKs Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APKs (Customer + Salon Shop)
          body: |
            Download APKs directly from Assets below:
            - **customer-app-debug.apk**: For Customers only (Slot booking, Live queue, UPI billing)
            - **salon-shop-debug.apk**: For Malik, Reception & Staff login in one app
          files: release-apks/*.apk
          prerelease: false
          make_latest: true
